server:
  port: 8080

spring:
  application:
    name: coop-banking-app
  datasource:
    url: jdbc:h2:file:./data/bankdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{20} - %msg%n"
  level:
    ke.coop.bank: DEBUG
